# `cargo nextest run`: every test gets a hard limit, so a hang (or a mutant that makes code
# spin) is killed in seconds instead of waiting for an outer watchdog (DESIGN 7.1).
#
# No retries in any profile: a test that fails once in a hundred runs is a bug to fix,
# not noise to rerun.
#
# leak-timeout: "leaky" means nextest had not seen EOF on the test's stdout/stderr within
# this period after the process exited. Threads cannot hold the pipes past exit (they die
# with the process) and no test or tool spawns a child: every thread in tests/concurrency.rs
# is joined, the stories spawn none. The marks seen on macOS came from the runner: std on
# Apple has no pipe2, so it makes the capture pipes with pipe() and sets FD_CLOEXEC after
# (rust-lang/rust#95584); nextest spawned tests from several threads, so a sibling spawned
# in that window inherited another test's pipe write end and held it until it exited. A
# sibling running > leak-timeout (json_differential 1.5 s, alloc 1.2 s) then made a 20 ms
# test LEAK at ~1.02 s. Reproduced with 300 empty tests: test processes held pipe fds > 2
# in 4-16 of 300 per run, and an empty test went LEAK at 1.012 s when its slow sibling held
# its pipe. nextest 0.9.145 creates the capture pipes itself, serialized with spawning;
# older versions warn below. 1s keeps a real leak (a child outliving the test) visible.
nextest-version = { recommended = "0.9.145" }

[profile.default]
retries = 0
leak-timeout = "1s"
slow-timeout = { period = "10s", terminate-after = 3 }
fail-fast = false

# CI: run everything, report every failure, JUnit for the run summary.
[profile.ci]
retries = 0
leak-timeout = "1s"
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# cargo-mutants (.cargo/mutants.toml): a mutant can loop and allocate without bound,
# so kill early, stop at the first failure (the mutant is caught) and leave cores free.
[profile.mutants]
retries = 0
slow-timeout = { period = "10s", terminate-after = 1 }
test-threads = 4
fail-fast = true
