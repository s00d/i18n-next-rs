name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'DESIGN.md', 'PLAN.md', 'CHANGELOG.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'DESIGN.md', 'PLAN.md', 'CHANGELOG.md']

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Binaryen release for `wasm-opt -Oz` in the size job.
  BINARYEN_VERSION: "123"
  # Nightly for cargo-public-api only (rustdoc JSON); bump together with the tool.
  PUBLIC_API_NIGHTLY: nightly-2026-08-07
  # Flip to "true" after the first crates.io release: turns on cargo-semver-checks.
  CRATES_PUBLISHED: "false"

jobs:
  # Native: stable on linux / macOS / windows, MSRV on linux; tests through nextest.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        # MSRV once, on linux: the code is the same on every OS.
        include:
          - os: ubuntu-latest
            toolchain: "1.90"
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit for tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (nextest, ci profile)
        run: cargo nextest run --workspace --locked --profile ci

      # `payload` (encode / apply for the Tauri plugin and a Rust guest) is off by default.
      - name: Tests with payload (nextest)
        run: cargo nextest run -p i18n-next --locked --features payload --profile ci

      # `Serialize for Text` exists only with the feature.
      - name: Tests with serde (nextest)
        run: cargo nextest run -p i18n-next --locked --features serde --profile ci

      # `currencyDisplay: name` and its 5.1k golden lines exist only with the feature.
      - name: Tests with currency-names (nextest)
        run: cargo nextest run -p i18n-next --locked --features currency-names --profile ci

      # Every CLDR locale ICU has: tag resolution and autonyms below `modern`
      # (number-locales-all.md; the test is a no-op in other builds).
      - name: Number goldens with every locale (nextest)
        env:
          I18N_NEXT_LOCALES: all
        run: cargo nextest run -p i18n-next --locked --test number_compat --profile ci

      # The micro build: no std-only, float or global code may leak into it.
      - name: Clippy (no default features)
        run: cargo clippy -p i18n-next --no-default-features --all-targets --locked -- -D warnings
      - name: Tests (no default features, nextest)
        run: cargo nextest run -p i18n-next --no-default-features --locked --profile ci

      - name: Doctests
        run: cargo test --doc --workspace --locked

      # Console tour over every locale, the axum server among its stops (DESIGN 8a).
      - name: playground-rust --check
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: cargo run -p playground-rust --locked -- --check

      - name: JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The core crate builds for the browser and WASI (DESIGN 2.1, 7.6); .wasm size of the micro,
  # full and guest builds after `wasm-opt -Oz`, against the budget and the PR base (DESIGN 2.4).
  wasm:
    name: wasm + size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .size-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build wasm32-unknown-unknown (default features)
        run: cargo build -p i18n-next --locked --target wasm32-unknown-unknown
      - name: Build wasm32-unknown-unknown (no default features)
        run: cargo build -p i18n-next --locked --target wasm32-unknown-unknown --no-default-features
      - name: Build wasm32-unknown-unknown (tauri-guest)
        run: cargo build -p i18n-next --locked --target wasm32-unknown-unknown --features tauri-guest
      # `tauri_guest` exists on wasm32-unknown-unknown only: the native clippy never sees it.
      - name: Clippy wasm32-unknown-unknown (tauri-guest)
        run: cargo clippy -p i18n-next --locked --lib --tests --target wasm32-unknown-unknown --features tauri-guest -- -D warnings
      - name: Build wasm32-unknown-unknown (without tz)
        run: cargo build -p i18n-next --locked --target wasm32-unknown-unknown --no-default-features --features std,format,global
      - name: Build wasm32-wasip1
        run: cargo build -p i18n-next --locked --target wasm32-wasip1

      # The runner must match the wasm-bindgen version in Cargo.lock exactly.
      - name: Install wasm-bindgen-test-runner and wasmtime
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n1)
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }},wasmtime

      - name: wasm-bindgen-test (Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        # `tauri-guest` adds tests/tauri_guest.rs (a fake __TAURI_INTERNALS__) to the defaults
        run: cargo test -p i18n-next --locked --target wasm32-unknown-unknown --features tauri-guest

      - name: wasm-bindgen-test (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_USE_BROWSER: "1"
        # CHROMEWEBDRIVER is preset on GitHub's ubuntu images.
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p i18n-next --locked --target wasm32-unknown-unknown --features tauri-guest

      - name: Tests on wasm32-wasip1 (wasmtime)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=.
        # WASI has no system zoneinfo inside wasmtime: a WASI app ships the bundled tzdb
        run: cargo test -p i18n-next --locked --target wasm32-wasip1 --features tzdb
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Size check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tools/size-check.sh "$PWD/.size-base"
          else
            tools/size-check.sh
          fi

  # Repository checks on one runner: no runtime deps (DESIGN 2.3); licenses, advisories and
  # unused deps (8b.10); compat goldens and generated data still match their JS oracles; the
  # public API snapshots in api/ (8b.9) and semver checks.
  checks:
    name: checks (deps, deny, compat, public API)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (webkit for tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PUBLIC_API_NIGHTLY }}
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Every target (`--target all`), so a `cfg(windows)` or wasm-only dependency counts too.
      - name: cargo tree must list only allowlisted dependencies
        run: |
          # Allowed direct runtime dependencies, one name per entry. DESIGN 2.3 allows only
          # `wasm-bindgen` and `js-sys`, for wasm32 with `tz` / `tauri-guest`: `js-sys` is the
          # browser's zones and clock (wasm32-unknown-unknown with `tz` only). The optional
          # integrations `chrono` / `time` (features of the same names, off by default) are
          # listed so a run with those features enabled passes too.
          allow=(js-sys chrono time)
          tree=$(cargo tree -e normal -p i18n-next --depth 1 --target all --locked --prefix none)
          echo "$tree"
          bad=()
          for dep in $(echo "$tree" | grep -v '^i18n-next v' | cut -d' ' -f1 | sort -u); do
            [[ " ${allow[*]} " == *" ${dep} "* ]] || bad+=("$dep")
          done
          if (( ${#bad[@]} )); then
            echo "::error::i18n-next gained runtime dependencies (DESIGN 2.3, owner decision required): ${bad[*]}"
            exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C scripts cldr
      - run: git diff --exit-code crates/i18n-next/src/plural/rules.rs crates/i18n-next/src/format/data fixtures/compat/__golden__/plural-categories.md fixtures/compat/__golden__/number-locales.md fixtures/compat/__golden__/number-locales-all.md
      - run: pnpm -C scripts casing
      - run: git diff --exit-code crates/i18n-next/src/linked/case_data.rs
      - run: pnpm -C scripts compat
      - run: git diff --exit-code fixtures/compat
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0,cargo-semver-checks@0.51.0
      - name: Snapshot matches api/
        run: |
          # `payload` (encode / apply, the plugin's side of the protocol) is public API too
          cargo +"$PUBLIC_API_NIGHTLY" public-api -ss -p i18n-next --features payload > api/i18n-next.txt
          # what exists on wasm32 only (`tauri_guest`); bench_inventory reads both snapshots
          cargo +"$PUBLIC_API_NIGHTLY" public-api -ss -p i18n-next --features tauri-guest --target wasm32-unknown-unknown > api/i18n-next-wasm.txt
          cargo +"$PUBLIC_API_NIGHTLY" public-api -ss -p tauri-plugin-i18n-next > api/tauri-plugin-i18n-next.txt
          git diff --exit-code api/ || {
            echo "::error::public API changed: regenerate api/*.txt with cargo public-api and commit the diff"
            exit 1
          }
      # cargo-semver-checks: until the first crates.io release there is no registry
      # baseline, so PRs compare with their base commit; after it (CRATES_PUBLISHED =
      # "true") the last published version is the baseline.
      - name: Semver checks (against the PR base commit)
        if: env.CRATES_PUBLISHED != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          cargo semver-checks -p i18n-next --features payload --baseline-rev "$BASE_SHA"
          cargo semver-checks -p tauri-plugin-i18n-next --baseline-rev "$BASE_SHA"
      - name: Semver checks (against crates.io)
        if: env.CRATES_PUBLISHED == 'true'
        run: |
          cargo semver-checks -p i18n-next --features payload
          cargo semver-checks -p tauri-plugin-i18n-next

  # Instruction counts with gungraun (Valgrind): deterministic, no timing noise. On PRs
  # the base commit is measured first and the PR fails on >3% more instructions (DESIGN 7.7).
  perf:
    name: perf + compare smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_HOME: ${{ github.workspace }}/target/gungraun
    steps:
      - uses: actions/checkout@v4
      - name: Checkout base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .perf-base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # The runner must match the gungraun version in Cargo.lock exactly.
      - name: gungraun version
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "gungraun") | .version' | head -n1)
          echo "GUNGRAUN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@${{ env.GUNGRAUN_VERSION }}
      - name: Baseline on the base commit
        if: github.event_name == 'pull_request' && hashFiles('.perf-base/crates/i18n-next/benches/instructions.rs') != ''
        working-directory: .perf-base
        run: cargo bench -p i18n-next --bench instructions -- --save-baseline=base
      - name: Instructions on this commit
        run: |
          if [ -d "$GUNGRAUN_HOME" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo bench -p i18n-next --locked --bench instructions -- --baseline=base --callgrind-limits='ir=3%'
          else
            cargo bench -p i18n-next --locked --bench instructions
          fi
      # benches/compare: one pass of every bench (`--test`), no timings or thresholds.
      - run: cargo bench -p compare --locked -- --test

  # guest-js (scripts live in crates/tauri-plugin-i18n-next/package.json).
  node:
    name: guest-js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime deps only (DESIGN 8b.10). high: a moderate/low advisory in a transitive dep must not
      # block every PR with no fix to take; renovate picks those up. High/critical fail the job.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm -C crates/tauri-plugin-i18n-next typecheck
      - name: Build guest-js and check dist
        run: pnpm -C crates/tauri-plugin-i18n-next build
      - run: pnpm -C crates/tauri-plugin-i18n-next test
      # a bench per public function (from the .d.ts snapshot), and every bench runs: a smoke
      # with a short time per task, no thresholds (the numbers are read locally, PLAN)
      - run: pnpm -C crates/tauri-plugin-i18n-next bench:inventory
      - name: Bench smoke
        run: pnpm -C crates/tauri-plugin-i18n-next bench
        env:
          BENCH_TIME: "20"

  # The playgrounds (DESIGN 8a, 8b.19) on one runner, each on its own workspace and lock with
  # the plugin and guest-js of this checkout: tauri-app (Vue front end type-checked and built
  # first: `generate_context!` embeds its dist), leptos-app (trunk for the browser, the Tauri
  # side with tauri-guest), nuxt-site (nuxt generate, texts equal `playground-rust --texts`).
  # The Android build of tauri-app is in heavy.yml (manual).
  examples:
    name: examples (tauri-app, leptos-app, nuxt-site)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (webkit for tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/tauri-app/src-tauri
            examples/leptos-app
            examples/leptos-app/src-tauri
      # pinned: trunk fetches the wasm-bindgen CLI of the app's Cargo.lock itself
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Front end (guest-js, then the Vue app)
        run: |
          pnpm install --frozen-lockfile
          pnpm -C crates/tauri-plugin-i18n-next build:lib
          pnpm -C examples/tauri-app typecheck
          pnpm -C examples/tauri-app build
      - name: tauri-app (Rust side)
        working-directory: examples/tauri-app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo build --locked
      - name: leptos-app front end (trunk build --release)
        working-directory: examples/leptos-app
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          trunk build --release --locked
          ls -l dist/*.wasm
          # the footer's size (post_build hook): "<bytes> <gzip bytes>"
          grep -E '^[0-9]+ [0-9]+$' dist/wasm-size.txt
      - name: leptos-app Tauri side
        working-directory: examples/leptos-app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo build --locked
      - name: nuxt-site (generate, texts equal the Rust tour's, shared locales untouched)
        working-directory: examples/nuxt-site
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm check
          git diff --exit-code -- ../locales
          test -z "$(git status --porcelain -- ../locales)"

  # Fuzz smoke (DESIGN 8b.11): 30 s per target from the fixtures, so a target that no longer
  # builds or a crash an obvious input reaches fails the PR.
  fuzz:
    name: fuzz smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZ_NIGHTLY: nightly-2026-08-07
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # the prebuilt cargo-fuzz is a musl binary and defaults to its own target
      - name: 30 s per target
        run: |
          for t in $(cargo +"$FUZZ_NIGHTLY" fuzz list); do
            case $t in
              load_json) seeds="fixtures/compat fixtures/json-test-suite" ;;
              template) seeds="fixtures/compat" ;;
              linked) seeds="fixtures/compat/linked" ;;
              # the target runs in an empty directory of its own: absolute paths
              page_names) seeds="$PWD/fixtures/compat/locales" ;;
              tzif) seeds="fixtures/tzif" ;;
              payload_apply) seeds="crates/tauri-plugin-i18n-next/tests/__golden__" ;;
              *) seeds="" ;;
            esac
            mkdir -p "fuzz/corpus/$t"
            cargo +"$FUZZ_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$t" "$PWD/fuzz/corpus/$t" $seeds -- -max_total_time=30
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
