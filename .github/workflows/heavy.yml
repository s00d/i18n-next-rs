# The Android build of tauri-app on a GitHub runner, so it never loads a developer machine.
# Manual (Actions -> heavy -> Run workflow).
name: heavy

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # tauri-app for Android (DESIGN 8a): `gen/android` is generated here, never
  # committed (tauri android init), then a debug APK for aarch64. The runner image has the
  # Android SDK and NDK; the lock must not move (the CLI runs cargo without --locked).
  tauri-android:
    name: tauri-app android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri-app/src-tauri
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm -C crates/tauri-plugin-i18n-next build:lib
      - name: Android APK (debug, aarch64)
        working-directory: examples/tauri-app
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          pnpm tauri android init --ci
          pnpm tauri android build --apk --target aarch64 --debug --ci
          ls -l src-tauri/gen/android/app/build/outputs/apk/universal/debug/
          git diff --exit-code -- src-tauri/Cargo.lock
