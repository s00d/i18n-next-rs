[package]
name = "i18n-next"
description = "i18n for Rust and Tauri on the same locale files as nuxt-i18n-micro: pages, plurals, Intl-compatible formats, no runtime dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["i18n", "localization", "translation", "tauri", "wasm"]
categories = ["internationalization", "localization", "wasm"]
include = ["/src/**/*", "/build.rs", "/tests/**/*.rs", "/tests/support/dir/**/*", "/benches/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md",
    # Workspace checks, not crate tests: version_sync reads the root Cargo.toml, the other
    # members and the plugin package.json; bench_inventory reads api/<crate>.txt at the
    # workspace root. None of them exist in the published package.
    "!/tests/version_sync.rs", "!/tests/bench_inventory.rs", "!/tests/support/inventory.rs",
    # Read the JSONTestSuite corpus / compat goldens from fixtures/ at the workspace root.
    "!/tests/json_differential.rs", "!/tests/compat.rs", "!/tests/support/compat.rs", "!/tests/wasm.rs",
    "!/tests/plural_props.rs", "!/tests/number_compat.rs", "!/tests/support/number.rs",
    "!/tests/date_compat.rs", "!/tests/support/date.rs", "!/tests/tz_fixtures.rs", "!/tests/linked_compat.rs"]

[lints]
workspace = true

# The lib has no criterion benches: without this, `cargo bench -p i18n-next -- --quick`
# hands `--quick` to the libtest harness of the lib, which rejects it.
[lib]
bench = false

# No runtime dependencies (DESIGN 2.3). Integrations come only behind features,
# off by default; CI (`deps` job) fails if the default build gains one.
[dependencies]
# `tracing` feature only (DESIGN 8b.17): misses and loads as events, off by default.
tracing = { version = "0.1", optional = true, default-features = false }
# `serde` feature only: `Text` serializes as its displayed string (`collect_str`).
serde = { version = "1.0.229", optional = true, default-features = false }

# Browser time zones (`tz` on wasm32-unknown-unknown only, DESIGN 2.1 / 5.4 / S12):
# `Intl.DateTimeFormat` and `Date`. A platform binding to JS, not logic. No default features:
# neither `unsafe-eval` (the `Function` constructor) nor `std` (pulls in futures-util) is needed.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3.107", optional = true, default-features = false }

[features]
default = ["std", "format", "tz", "global"]
std = []
format = []
# Time zones (src/tz, DESIGN 5.4). On wasm32-unknown-unknown through `js-sys`.
tz = ["dep:js-sys"]
global = []
serde = ["dep:serde"]
tracing = ["dep:tracing"]
watch = []
# The bundled IANA tzdb (src/tz/tzdb.bin from scripts/tzdb.mjs, transitions since 1970):
# a fallback after the platform's zones. Windows has no TZif files, so there `tz` always
# includes it (`cfg(windows)` in src/tz): a feature cannot be on by default for one target.
tzdb = ["tz"]
currency-names = []
tauri-guest = []
chrono = []
time = []

# Checks only, never shipped (DESIGN 2.3). Native-only: proptest models and dhat run
# native (7.6), criterion does not build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.12"
dhat = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Oracles for the own `json` and `hash` (DESIGN 7.3a): differential tests and the
# comparison benches only, never a runtime dependency (2.3).
serde_json = "1.0.154"
serde = "1.0.229"
foldhash = "0.2"
rustc-hash = "2.1"
# Oracle of the own `tz` (tests/tz_*.rs): system TZif files and its bundled tzdb, which is
# the IANA release scripts/tzdb.mjs bundles.
jiff = { version = "0.2.45", features = ["tzdb-bundle-always"] }
# tests/tracing.rs: `with_default` needs `std` (the library dep stays without it).
tracing = { version = "0.1", features = ["std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "0.20"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# `ensure_async` with the platform's real `fetch` in tests/wasm.rs (no web-sys).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[[bench]]
name = "lookup"
harness = false
# float args and counts
required-features = ["format"]

[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "json"
harness = false

[[bench]]
name = "plural"
harness = false

[[bench]]
name = "linked"
harness = false

[[bench]]
name = "sources"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "number"
harness = false
required-features = ["format"]

[[bench]]
name = "tz"
harness = false

# Models and differentials that build floats (`Arg::Float`, `Count::from(f64)`) or the
# float printer: with `--no-default-features` they are skipped, the rest still runs.
[[test]]
name = "text_model"
required-features = ["format"]

[[test]]
name = "catalog_model"
required-features = ["format"]

[[test]]
name = "compat"
required-features = ["format"]

[[test]]
name = "format_stories"
required-features = ["format"]

[[test]]
name = "number_compat"
required-features = ["format"]

[[test]]
name = "json_differential"
required-features = ["format"]
