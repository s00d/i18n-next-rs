[package]
name = "tauri-plugin-i18n-next"
description = "Tauri plugin for i18n-next: one locale catalog for the Rust backend, native UI and the WebView"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["tauri", "plugin", "i18n", "localization", "translation"]
categories = ["internationalization", "localization"]
include = ["/src/**/*", "/permissions/**/*", "/tests/**/*.rs", "/build.rs", "/windows-test-manifest.xml", "/Cargo.toml", "/README.md"]
links = "tauri-plugin-i18n-next"

[lints]
workspace = true

[dependencies]
# Pinned to the same release (DESIGN 8b.13, checked by tests/version_sync.rs).
i18n-next = { version = "=0.1.0", path = "../i18n-next" }
tauri = "2.12"
serde = { version = "1.0", features = ["derive"] }
# serde_json joins [dependencies] with the payload commands (M7); nothing uses it yet.

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
serde_json = "1.0"
