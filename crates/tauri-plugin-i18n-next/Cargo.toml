[package]
name = "tauri-plugin-i18n-next"
description = "Tauri plugin for i18n-next: one locale catalog for the Rust backend, native UI and the WebView"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["tauri", "plugin", "i18n", "localization", "translation"]
categories = ["internationalization", "localization"]
readme = "CRATE_README.md"
include = ["/src/**/*", "/permissions/**/*", "/build.rs", "/windows-test-manifest.xml", "/Cargo.toml", "/CRATE_README.md", "/LICENSE", "/CHANGELOG.md"]
links = "tauri-plugin-i18n-next"

[lints]
workspace = true

[dependencies]
# Pinned to the same release (DESIGN 8b.13, checked by tests/version_sync.rs).
# `payload`: the front-end payload; `serde`: commands return `Text` translated; `watch`:
# reload on file changes in dev (DESIGN 8b.5).
i18n-next = { version = "=0.1.1", path = "../i18n-next", features = ["payload", "serde", "watch"] }
tauri = "2.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# `Relabel` for the tray icon's tooltip; needs tauri's feature of the same name.
tray-icon = ["tauri/tray-icon"]

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ipc"
harness = false
