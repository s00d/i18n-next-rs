[default]
description = "What the front end needs (DESIGN 8b.2): the meta (tags, chains, formats), load the payload and pages, read and switch the locale. `report_missing` (dev only) is not included: add `i18n-next:allow-report-missing` to a dev capability."
permissions = [
  "allow-load",
  "allow-load-page",
  "allow-meta",
  "allow-get-locale",
  "allow-available-locales",
  "allow-pages",
  "allow-set-locale",
]
