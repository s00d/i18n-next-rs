[package]
name = "playground-rust"
description = "Console tour of i18n-next on the shared examples/locales catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "playground-rust"

[lints]
workspace = true

[dependencies]
i18n-next = { path = "../../crates/i18n-next", features = ["serde"] }
# The server (bin/server.rs, DESIGN 8a); playground only, never a dependency of the crates.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
# `--texts` (the Nuxt site's check)
serde_json = "1"
