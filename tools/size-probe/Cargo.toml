[package]
name = "size-probe"
description = "wasm probe for the CI size job: how many .wasm bytes i18n-next adds (DESIGN 2.4)"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace and lock: excluded from the main one so `cargo test --workspace`
# never builds the probe with release-for-size settings.
[workspace]

# Same rule as the workspace: no unsafe anywhere (see src/main.rs for why a binary).
[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "size_probe"
path = "src/main.rs"

[features]
# micro build: i18n-next with default-features = false; `full` turns the defaults on.
full = ["i18n-next/default"]
# The probe without any call into i18n-next (it allocates once, so the allocator counts
# as runtime): the constant std runtime that tools/size-check.sh subtracts from the other
# variants.
empty = []
# A minimal Rust front end inside Tauri (M9): the micro build plus `tauri-guest` and `global`
# (`connect`, `set_page`, `set_locale` on a spawned task, `t!` on the installed guest),
# reported and budgeted on its own.
guest = ["i18n-next/tauri-guest", "i18n-next/global", "dep:js-sys"]

[dependencies]
i18n-next = { path = "../../crates/i18n-next", default-features = false }
# `guest` only: the task `connect` runs on (js-sys's own futures, as tauri_guest uses them)
js-sys = { version = "0.3", optional = true, default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
